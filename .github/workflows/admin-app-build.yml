name: Admin App Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Admin Debug APK
        working-directory: admin-app
        run: gradle :app:assembleDebug --stacktrace

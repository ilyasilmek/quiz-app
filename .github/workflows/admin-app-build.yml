name: Admin App Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build Admin Debug APK
        working-directory: admin-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload Admin Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bilgi-arenasi-admin-debug-apk
          path: admin-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
